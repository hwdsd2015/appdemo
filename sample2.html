<!DOCTYPE html>
<html>
<head>
  <title>Sample 2 - With Colors</title>
  <style>
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    p {
      color: #1a4f8b;
      font-size: 20px;
    }
    button {
      background-color: #1a4f8b;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #14406f;
    }
  </style>
</head>
<body>
  <p>Hello, this is my first page.</p>
  <button>Click Me</button>
</body>
</html>
