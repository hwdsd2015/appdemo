<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NASA Demo - Choose Data</title>
  <style>
    body { background-color: #0b1020; font-family: Arial, sans-serif; padding: 40px; }
    .card {
      background: #ffffff; max-width: 460px; margin: 0 auto; padding: 24px 28px;
      border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    h1 { color: #1a4f8b; margin-top: 0; }
    label { display: block; margin-top: 16px; font-weight: bold; color: #333; }
    .hint { font-weight: normal; color: #777; font-size: 13px; }
    input, select {
      width: 100%; padding: 8px; font-size: 15px; margin-top: 4px;
      border: 1px solid #c3ccd6; border-radius: 4px; box-sizing: border-box;
    }
    button {
      background-color: #1a4f8b; color: #ffffff; border: none; padding: 12px 24px;
      font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 24px; width: 100%;
    }
    button:hover { background-color: #14406f; }
    .error { color: #c0392b; margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NASA Data Explorer</h1>

    <form id="configForm">
      <label for="dataset">What NASA data?</label>
      <select id="dataset">
        <option value="neo">Near-Earth Asteroids (NeoWs)</option>
        <option value="flares">Solar Flares (DONKI)</option>
        <option value="apod">Astronomy Picture of the Day (APOD)</option>
        <option value="eonet">Earth Observatory Natural Event Tracker (EONET)</option>
        <option value="epic">Earth Polychromatic Imaging Camera (EPIC)</option>
        <option value="gibs">Global Imagery Browse Services (GIBS)</option>
        <option value="insight">Mars Weather Service (InSight)</option>
        <option value="images">NASA Image and Video Library</option>
        <option value="ssc">Satellite Situation Center (SSC)</option>
        <option value="techport">NASA Technology Projects (Techport)</option>
        <option value="tle">Two-Line Element Sets (TLE API)</option>
        <option value="trek">Vesta/Moon/Mars Trek Map Tiles (WMTS)</option>
        <!-- These hosts block browser requests (no CORS header), so data.html
             fetches them through server.py's /proxy. -->
        <optgroup label="Needs python3 server.py">
          <option value="exoplanet">Exoplanet Archive (Exoplanet)</option>
          <option value="osdr">Open Science Data Repository (OSDR)</option>
          <option value="ssd-cneos">Solar System Dynamics / Near-Earth Object Studies (SSD/CNEOS)</option>
          <option value="techtransfer">Patents, Software &amp; Tech Transfer (TechTransfer)</option>
        </optgroup>
      </select>

      <label for="days">How many days? <span class="hint">(1 - 365, ending today)</span></label>
      <input type="number" id="days" min="1" max="365" value="7">

      <label for="query">Search word <span class="hint">(Images, TechTransfer, TLE only)</span></label>
      <input type="text" id="query" value="">

      <label for="apiKey">API key <span class="hint">(get your own at api.nasa.gov)</span></label>
      <input type="text" id="apiKey" value="DEMO_KEY">

      <label for="storageKey">Save into localStorage key</label>
      <input type="text" id="storageKey" value="nasaData">

      <div class="error" id="error"></div>

      <button type="submit">Next: Fetch Data</button>
    </form>
  </div>

  <script>
    // Local date as YYYY-MM-DD (toISOString would use UTC, which can be "tomorrow")
    function toYMD(d) {
      return d.getFullYear() + "-" +
             String(d.getMonth() + 1).padStart(2, "0") + "-" +
             String(d.getDate()).padStart(2, "0");
    }

    document.getElementById("configForm").addEventListener("submit", function (event) {
      event.preventDefault();

      var days = parseInt(document.getElementById("days").value, 10);
      var apiKey = document.getElementById("apiKey").value.trim() || "DEMO_KEY";
      var storageKey = document.getElementById("storageKey").value.trim();

      if (!(days >= 1 && days <= 365)) {
        document.getElementById("error").textContent = "Days must be between 1 and 365.";
        return;
      }
      if (storageKey === "") {
        document.getElementById("error").textContent = "Please enter a localStorage key.";
        return;
      }

      // Work out the date range: (days - 1) days ago up to today, as YYYY-MM-DD
      var end = new Date();
      var start = new Date();
      start.setDate(end.getDate() - (days - 1));

      var config = {
        dataset: document.getElementById("dataset").value,
        apiKey: apiKey,
        storageKey: storageKey,
        startDate: toYMD(start),
        endDate: toYMD(end),
        query: document.getElementById("query").value.trim()
      };

      try {
        // The config always lives under a fixed key so data.html can find it.
        localStorage.setItem("nasaConfig", JSON.stringify(config));
      } catch (e) {
        document.getElementById("error").textContent = "Browser storage is blocked.";
        return;
      }

      window.location.href = "data.html";
    });
  </script>
</body>
</html>
